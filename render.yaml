services:
  - type: web
    name: aicte-dashboard-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 50
    envVars:
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ENABLE_TELEGRAM_POLLER
        value: "true"
      - key: ENABLE_EMBEDDING_WARMUP
        value: "false"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: RUN_STARTUP_MIGRATIONS
        value: "false"
